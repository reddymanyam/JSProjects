<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simple E-Commerce</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      padding: 0;
      margin: 0;
    }
    nav {
      background-color: #333;
      color: white;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin-left: 1rem;
    }
    .container {
      padding: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .product {
      border: 1px solid #ddd;
      border-radius: 8px;
      width: 200px;
      padding: 1rem;
      text-align: center;
    }
    .product img {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }
    .btn {
      margin-top: 10px;
      background-color: #28a745;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
    }
    .cart-page {
      padding: 2rem;
    }
    .cart-item {
      margin-bottom: 1rem;
      border-bottom: 1px solid #ccc;
      padding-bottom: 1rem;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav>
    <div><strong>My Shop</strong></div>
    <div>
      <a href="#" onclick="showProducts()">Home</a>
      <a href="#" onclick="showCart()">Cart (<span id="cart-count">0</span>)</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div id="main-content"></div>

  <script>
    const products = [
      { id: 1, name: "Laptop", price: 999, image: "https://via.placeholder.com/200x150?text=Laptop" },
      { id: 2, name: "Phone", price: 599, image: "https://via.placeholder.com/200x150?text=Phone" },
      { id: 3, name: "Headphones", price: 199, image: "https://via.placeholder.com/200x150?text=Headphones" },
    ];

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    function updateCartCount() {
      document.getElementById("cart-count").textContent = cart.length;
    }

    function showProducts() {
      const container = document.getElementById("main-content");
      container.innerHTML = '<div class="container">' +
        products.map(p => `
          <div class="product">
            <img src="${p.image}" alt="${p.name}" />
            <h3>${p.name}</h3>
            <p>$${p.price}</p>
            <button class="btn" onclick="addToCart(${p.id})">Add to Cart</button>
          </div>
        `).join("") +
        '</div>';
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      cart.push(product);
      localStorage.setItem("cart", JSON.stringify(cart));
      updateCartCount();
      alert(`${product.name} added to cart!`);
    }

    function showCart() {
      const container = document.getElementById("main-content");
      if (cart.length === 0) {
        container.innerHTML = `<div class="cart-page"><h2>Your cart is empty.</h2></div>`;
        return;
      }
      container.innerHTML = `
        <div class="cart-page">
          <h2>Your Cart</h2>
          ${cart.map(item => `
            <div class="cart-item">
              <h4>${item.name}</h4>
              <p>Price: $${item.price}</p>
            </div>
          `).join("")}
        </div>
      `;
    }

    // Initialize
    updateCartCount();
    showProducts();
  </script>

</body>
</html>
